name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one production deploy can be in flight at a time. Don't cancel a
# running one — let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          # Supabase project, public key, and admin password hash. Service
          # role key ships in the /admin chunk only (Vite tree-shakes it
          # out of the user-facing bundle).
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC_ADMIN_PASSWORD_HASH: ${{ secrets.PUBLIC_ADMIN_PASSWORD_HASH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
