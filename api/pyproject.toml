[project]
name = "pulse-api"
version = "0.1.0"
description = "FastAPI backend for Pulse"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "pydantic[email]>=2.9",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "uvicorn[standard]>=0.32",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "polyfactory>=2.18",
    "freezegun>=1.5",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=pulse_api --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["pulse_api"]
omit = [
    "pulse_api/migrations/*",
    "tests/*",
]
branch = true
# SQLAlchemy async runs ORM code on greenlet workers — without this the
# tracer loses execution context across `await session.execute(...)` and
# under-reports route + repo coverage.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true
