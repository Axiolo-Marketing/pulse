[defaults]
inventory             = inventory.yml
host_key_checking     = True
retry_files_enabled   = False
deprecation_warnings  = False
# Built-in default callback. The community.general `yaml` callback crashes
# under Python 3.13 / current ansible-core ("argument 'code' must be code,
# not str"); it's deprecated anyway in favor of ansible-core's default.
stdout_callback       = default
forks                 = 5

[ssh_connection]
pipelining            = True
control_path          = /tmp/ansible-ssh-%%h-%%p-%%r
