# Pulse deploy playbook.
#
# Runs on a SHARED Debian VPS that already hosts other apps. The preflight
# role installs missing prerequisites without upgrades; all app changes stay
# inside Pulse's slice. First run should always include `--check --diff` so
# the operator can read every diff before applying for real.
#
# Usage (./deploy.sh at the repo root is the standard entry point):
#   ./deploy.sh --check   # preview — runs with --check --diff
#   ./deploy.sh           # apply
#
# Bootstrap notes for DNS, sudo, and intentional global config live in
# deploy/README.md.

- name: Deploy Pulse
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: preflight        # installs/validates host prerequisites, copies the deploy key, then creates Pulse-owned paths
    - role: postgres-pulse   # creates pulse DB + roles inside the existing Postgres
    - role: backend          # git pull → /opt/pulse/source, venv at /opt/pulse/venv, systemd unit, .env
    - role: frontend         # npm ci + npm run build inside /opt/pulse/source — nginx serves dist/ via the /var/www/pulse symlink
    - role: nginx-site       # first pass: HTTP-only if the TLS cert does not exist yet
    - role: tls              # requests cert via webroot; nginx stays online for other apps
    - role: nginx-site       # second pass: promotes to HTTPS once the cert exists
