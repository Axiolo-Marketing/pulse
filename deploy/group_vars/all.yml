# Deploy configuration. Non-secret values are plain; secrets are inline
# ansible-vault encrypted strings at the bottom of this file (decrypted at
# runtime via --vault-password-file). Run the playbook with `make deploy-check`
# / `make deploy-apply`, which pass the vault password file automatically.

# ── Identity ──────────────────────────────────────────────────────────────
pulse_domain: pulse.axiolo.com
pulse_admin_email: ops@axiolo.com # Let's Encrypt registration only

# ── Paths Pulse owns (Ansible never touches anything outside these) ──────
pulse_user: pulse
pulse_group: pulse
pulse_app_dir: /opt/pulse
pulse_source_dir: "{{ pulse_app_dir }}/source" # full git checkout
pulse_api_dir: "{{ pulse_source_dir }}/api" # backend working dir
pulse_venv_dir: "{{ pulse_app_dir }}/venv" # outside source/ so `git clean -fdx` cannot wipe it
pulse_dist_dir: "{{ pulse_source_dir }}/dist" # Astro build output
pulse_web_root: /var/www/pulse
pulse_uploads_dir: /var/lib/pulse/uploads
pulse_env_dir: /etc/pulse
pulse_env_file: "{{ pulse_env_dir }}/pulse.env"
pulse_deploy_key_remote: "{{ pulse_env_dir }}/deploy_key"
pulse_log_dir: /var/log/pulse
pulse_backup_dir: /var/backups/pulse

# ── Source (git) ─────────────────────────────────────────────────────────
# The playbook clones the repo on the VPS and builds there. Match the
# pattern used by image-compressor / sitechecker / octoping deploys.
pulse_repo_url: git@github.com:Axiolo-Marketing/pulse.git
pulse_repo_branch: main
# Local path on the operator's machine to an SSH private key that has read
# access to the repo above. This is the same key reused across the other
# Axiolo deploys (image-compressor, sitechecker, octoping) — it has access
# to all of Axiolo-Marketing's repos, so no per-repo Deploy Key needed. The
# playbook copies it to {{ pulse_deploy_key_remote }} (0600, pulse-owned) so
# the `git` module can clone over SSH on the VPS.
pulse_deploy_key_path: "~/.ssh/github_deploy_key"

# ── Backend process ───────────────────────────────────────────────────────
pulse_python: /usr/bin/python3.13 # preflight asserts this exists
pulse_api_port: 8421 # 127.0.0.1-only; nginx fronts it
pulse_uvicorn_workers: 2

# ── Database ──────────────────────────────────────────────────────────────
pulse_db_name: pulse
pulse_db_owner: pulse_owner
pulse_db_anon: pulse_anon
pulse_db_admin: pulse_admin
# pulse_member runs admin routes with no BYPASSRLS, RLS scopes by pulse.org_id.
# Added in the v3 multi-tenant migration (PR 1 / Alembic 0004).
pulse_db_member: pulse_member
pulse_db_host: 127.0.0.1
pulse_db_port: 5432

# ── Frontend ──────────────────────────────────────────────────────────────
# Astro now builds on the VPS (npm ci + npm run build inside the cloned
# source tree). The frontend role then syncs {{ pulse_dist_dir }} →
# {{ pulse_web_root }} locally on the VPS.

# ── OAuth redirect URIs (must match what's configured in Google/Microsoft) ─
pulse_google_redirect_uri: "https://{{ pulse_domain }}/api/auth/google/callback"
pulse_microsoft_redirect_uri: "https://{{ pulse_domain }}/api/auth/microsoft/callback"
pulse_microsoft_tenant_id: common

# ── Outbound email (Resend) ────────────────────────────────────────────────
# Transactional mail (invites, verification, password reset) goes via Resend's
# HTTPS API. `pulse_email_from` must be on a Resend-verified domain. We reuse
# the already-verified `notifications.axiolo.com` domain — Resend authorizes
# any mailbox on a verified domain, so `pulse@` needs no extra DNS. (To send
# from a `pulse.axiolo.com` address instead, add + verify that subdomain as a
# separate Resend domain first.) The API key is vaulted below; empty key ⇒
# app stays in log-only mode.
pulse_email_from: "Pulse <pulse@notifications.axiolo.com>"

# ── Scheduled reminders ─────────────────────────────────────────────────────
# The daily `pulse-reminders` cron nudges invited recipients who haven't
# finished. OFF by default — flip `pulse_reminders_enabled` to true to start
# sending. Thresholds are in days; `pulse_reminder_max` caps total nudges.
pulse_reminders_enabled: false
pulse_reminder_inactivity_days: 7
pulse_reminder_cadence_days: 7
pulse_reminder_max: 3

# ── Reactive cards (LLM follow-ups, SPEC §15) ───────────────────────────────
# Deployment-level gate for AI-generated follow-up questions on respondent
# corrections. OFF by default; enabling also requires the vaulted
# `vault_pulse_anthropic_api_key` below, plus the per-org allow flag
# (superadmin) and the per-engagement toggle — see deploy/README.md.
# `pulse_reactive_model` may be any current Claude model id; cost estimates
# in the superadmin usage panel are priced for the ids listed in
# api/pulse_api/reactive.py MODEL_PRICING.
pulse_reactive_cards_enabled: true
pulse_reactive_model: "claude-haiku-4-5"

# ── Off-box backups (H2) ───────────────────────────────────────────────────
# The daily `pulse-backup` cron already writes local pg_dump + uploads-mirror
# copies to {{ pulse_backup_dir }} — that stays the fast-path restore. This
# section adds an OFF-BOX push of that same directory to Cloudflare R2 (an
# S3-compatible object store) via restic, so a lost/corrupted VPS disk isn't
# a total-loss event. OFF by default (`pulse_restic_enabled: false`) — this
# path is UNTESTED until an operator provisions R2 + runs `restic init` by
# hand and flips the switch. See deploy/README.md "Off-box backups" for the
# bootstrap + restore steps.
pulse_restic_enabled: false
# Non-secret: your Cloudflare R2 bucket name and S3-compatible endpoint
# (Cloudflare dashboard → R2 → Manage API tokens shows the account-scoped
# endpoint, shape `https://<accountid>.r2.cloudflarestorage.com`). Leave
# blank until provisioned — the cron template only renders the restic job
# when pulse_restic_enabled is true, so blank values here are harmless
# while the feature is off.
pulse_restic_r2_bucket: ""
pulse_restic_r2_endpoint: ""
pulse_restic_repository: "s3:{{ pulse_restic_r2_endpoint }}/{{ pulse_restic_r2_bucket }}"
# How many daily off-box snapshots restic keeps (restic forget --keep-daily).
pulse_restic_retention_days: 30

# ── App config ────────────────────────────────────────────────────────────
# Superadmins. Each email here is stamped is_superadmin=true by migration
# 0004's data migration (the env var is read at execution time). In v3 this
# replaces the v2 is_admin column — per-org admin powers come from
# organization_memberships.role='owner' instead.
# Adding an email here does NOT promote an existing user retroactively;
# run a one-shot SQL UPDATE for that case.
pulse_admin_emails:
  - gabriel@axiolo.com
  - tom@axiolo.com
# Production is invite-only — the legacy POST /api/auth/signup returns 404.
# Override to true only if you genuinely want public signup back.
pulse_signup_enabled: false
# Flips the Secure flag on session + state cookies. Set to "development" only
# on the dev compose stack — anything else (or unset) treats cookies as
# production-grade.
pulse_environment: production
pulse_max_upload_bytes: 26214400 # 25 MB
pulse_session_max_age_seconds: 2592000 # 30 days

