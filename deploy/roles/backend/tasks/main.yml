# Backend role: install + run the FastAPI app from /opt/pulse/source/api.
#
# Source comes from `git pull` on the VPS (matches image-compressor /
# sitechecker / octoping deploys). The frontend role builds Astro from the
# same checkout, so both share one clone.
#
# Order:
#   1. Clone or update the repo at {{ pulse_source_dir }}.
#   2. Create a venv at {{ pulse_venv_dir }} (outside the source tree).
#   3. uv sync --frozen into the venv.
#   4. Template /etc/pulse/pulse.env from group_vars + vault.
#   5. Run alembic upgrade head.
#   6. Seed the initial admin user (idempotent — ON CONFLICT DO NOTHING).
#   7. Drop the systemd unit, daemon-reload, enable + restart.

# ── 1. Source clone/update ────────────────────────────────────────────────
# pulse is a `create_home: false` system user; export HOME so git/uv/npm
# never touch /home/pulse (which doesn't exist).
- name: Clone or update repository at {{ pulse_source_dir }}
  ansible.builtin.git:
    repo: "{{ pulse_repo_url }}"
    dest: "{{ pulse_source_dir }}"
    version: "{{ pulse_repo_branch }}"
    force: true
    update: true
    accept_hostkey: true
    key_file: "{{ pulse_deploy_key_remote }}"
  become_user: "{{ pulse_user }}"
  environment:
    HOME: "{{ pulse_app_dir }}"
  notify: Restart pulse-api

- name: Ensure {{ pulse_source_dir }} is owned by {{ pulse_user }}:{{ pulse_group }}
  ansible.builtin.file:
    path: "{{ pulse_source_dir }}"
    owner: "{{ pulse_user }}"
    group: "{{ pulse_group }}"
    recurse: true

- name: Ensure venv exists at {{ pulse_venv_dir }}
  ansible.builtin.command: "{{ pulse_python }} -m venv {{ pulse_venv_dir }}"
  args:
    creates: "{{ pulse_venv_dir }}/bin/python"
  become_user: "{{ pulse_user }}"

- name: Install uv into the venv
  ansible.builtin.pip:
    name: uv
    state: present
    virtualenv: "{{ pulse_venv_dir }}"
  become_user: "{{ pulse_user }}"

- name: Sync Python dependencies via uv (--frozen against uv.lock)
  ansible.builtin.command: "{{ pulse_venv_dir }}/bin/uv sync --frozen --no-dev"
  args:
    chdir: "{{ pulse_api_dir }}"
  become_user: "{{ pulse_user }}"
  environment:
    HOME: "{{ pulse_app_dir }}"
    UV_PROJECT_ENVIRONMENT: "{{ pulse_venv_dir }}"
  register: uv_sync
  changed_when: "'No changes detected' not in (uv_sync.stderr | default(''))"

# ── 2. Environment file (mode 0640 so only pulse user + group reads it) ──
- name: Template /etc/pulse/pulse.env
  ansible.builtin.template:
    src: pulse.env.j2
    dest: "{{ pulse_env_file }}"
    owner: "{{ pulse_user }}"
    group: "{{ pulse_group }}"
    mode: "0640"
  notify: Restart pulse-api

# ── 3. Migrations ─────────────────────────────────────────────────────────
# Fresh DB snapshot immediately before `alembic upgrade head`, so any deploy
# that applies a destructive migration has a same-minute rollback point (the
# 03:15 daily dump can be hours stale). Pulse-scoped: same DB, pgpass, and
# backup dir as the daily cron. `pipefail` means a failed dump aborts the play
# BEFORE migrating — never migrate a DB you couldn't back up. Skipped under
# `--check` (shell tasks don't run in check mode), so the dry run stays read-only.
- name: Snapshot the Pulse DB before migrating
  ansible.builtin.shell: >-
    set -o pipefail &&
    PGPASSFILE={{ pulse_env_dir }}/pgpass
    pg_dump --host={{ pulse_db_host }} --port={{ pulse_db_port }}
    --username={{ pulse_db_owner }} --dbname={{ pulse_db_name }}
    | gzip > {{ pulse_backup_dir }}/db-predeploy-$(date +%FT%H%M%S).sql.gz
    && find {{ pulse_backup_dir }} -maxdepth 1 -name 'db-predeploy-*.sql.gz' -mtime +30 -delete
  args:
    executable: /bin/bash
  become_user: "{{ pulse_user }}"
  changed_when: true

- name: Run alembic upgrade head
  ansible.builtin.command: "{{ pulse_venv_dir }}/bin/alembic upgrade head"
  args:
    chdir: "{{ pulse_api_dir }}"
  environment:
    DATABASE_URL: "postgresql+asyncpg://{{ pulse_db_owner }}:{{ vault_pulse_db_owner_password | urlencode | replace('/', '%2F') }}@{{ pulse_db_host }}:{{ pulse_db_port }}/{{ pulse_db_name }}"
  become_user: "{{ pulse_user }}"
  register: alembic_result
  changed_when: "'Running upgrade' in alembic_result.stdout"

# ── 4. Seed superadmin users + Axiolo org membership (idempotent).
#
# password_hash is left NULL; each operator signs in via Google or Microsoft
# OAuth using an account whose email matches one of these — the callback in
# api/pulse_api/routes/oauth.py links the OAuth identity to the seeded row
# and issues a session. "Forgot password?" is NOT a valid first-login path
# here: auth.py:forgot_password skips users with password_hash IS NULL by
# design.
#
# v3 (multi-tenant) shape:
#   * users.is_admin is gone — replaced by is_superadmin (cross-tenant) and
#     by organization_memberships.role='owner' (per-org).
#   * Migration 0004 created the Axiolo org with slug='axiolo'; we join
#     each seeded user to it as owner here so they can immediately use
#     /admin/ end-to-end without a second bootstrap step.
#   * `on conflict (email) do update` lets the task retroactively promote
#     an existing non-superadmin user — desired for upgrading an existing
#     v2 install. It only sets the flag true; removing an email from the
#     list never demotes (consistent with the v2 task's "doesn't wipe" rule).
- name: Seed superadmin users + Axiolo org owner memberships
  community.postgresql.postgresql_query:
    # `login_db` replaces the deprecated `db` alias.
    login_db: "{{ pulse_db_name }}"
    login_user: "{{ pulse_db_owner }}"
    login_password: "{{ vault_pulse_db_owner_password }}"
    login_host: "{{ pulse_db_host }}"
    login_port: "{{ pulse_db_port }}"
    query: |
      with seeded_user as (
        insert into public.users (email, is_superadmin, email_verified_at)
        values (%s, true, now())
        on conflict (email) do update
          set is_superadmin = true
        returning id
      ),
      axiolo as (
        select id from public.organizations where slug = 'axiolo'
      )
      insert into public.organization_memberships (org_id, user_id, role)
      select axiolo.id, seeded_user.id, 'owner'
      from seeded_user, axiolo
      on conflict (org_id, user_id) do nothing
    positional_args:
      - "{{ item }}"
  loop: "{{ pulse_admin_emails }}"
  changed_when: false  # idempotent upsert; reporting "changed" every run is noisy

# ── 5. Systemd unit ───────────────────────────────────────────────────────
- name: Drop pulse-api.service
  ansible.builtin.template:
    src: pulse-api.service.j2
    dest: /etc/systemd/system/pulse-api.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart pulse-api

- name: Enable + start pulse-api.service
  ansible.builtin.systemd:
    name: pulse-api
    enabled: true
    state: started

# ── 6. Backup cron (Pulse-scoped — separate file in /etc/cron.d so it
# never collides with other apps' crontabs)
- name: Drop pgpass for Pulse backup cron
  ansible.builtin.template:
    src: pulse.pgpass.j2
    dest: "{{ pulse_env_dir }}/pgpass"
    owner: "{{ pulse_user }}"
    group: "{{ pulse_group }}"
    mode: "0600"

- name: Drop /etc/cron.d/pulse-backup
  ansible.builtin.template:
    src: pulse-backup.cron.j2
    dest: /etc/cron.d/pulse-backup
    owner: root
    group: root
    mode: "0644"
