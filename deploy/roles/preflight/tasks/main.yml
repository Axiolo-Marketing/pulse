# Preflight: install missing host prerequisites, then create only Pulse-owned
# users and directories. Packages use apt state=present only: no upgrades, no
# third-party repositories, and no edits to shared nginx/Postgres config.

- name: Install shared host prerequisites if missing
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - nginx
      - certbot
      - rsync
      - acl
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Python 3.13 runtime prerequisites if available
  block:
    - name: Install Python 3.13 and venv support
      ansible.builtin.apt:
        name:
          - python3.13
          - python3.13-venv
        state: present
        update_cache: true
        cache_valid_time: 3600
  rescue:
    - name: Explain missing Python 3.13 apt packages
      ansible.builtin.fail:
        msg: >
          Python 3.13 packages are not available from this VPS apt
          configuration. Install {{ pulse_python }} and its venv support
          manually, or configure the host's package sources intentionally,
          then rerun the Pulse playbook.

- name: Ensure Postgres is running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Ensure nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: Verify Postgres 14+ is installed
  ansible.builtin.command: psql --version
  register: pg_version_check
  changed_when: false
  failed_when: >
    pg_version_check.rc != 0
    or 'psql (PostgreSQL)' not in pg_version_check.stdout
    or (pg_version_check.stdout | regex_search('[0-9]+') | int) < 14

- name: Verify the sites-available / sites-enabled layout exists
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled
  register: sites_enabled
  failed_when: not sites_enabled.stat.exists or not sites_enabled.stat.isdir

- name: Verify certbot is installed
  ansible.builtin.command: certbot --version
  register: certbot_check
  changed_when: false
  failed_when: certbot_check.rc != 0

- name: Verify {{ pulse_python }} is installed
  ansible.builtin.command: "{{ pulse_python }} --version"
  register: python_check
  changed_when: false
  failed_when: python_check.rc != 0

- name: Verify rsync is installed
  ansible.builtin.command: rsync --version
  register: rsync_check
  changed_when: false
  failed_when: rsync_check.rc != 0

# ── From here on, the preflight CREATES Pulse-owned directories and the
# unprivileged service user. These are all Pulse's own resources — nothing
# else on the box can collide.

- name: Create pulse system user
  ansible.builtin.user:
    name: "{{ pulse_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create Pulse-owned directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pulse_app_dir }}",     owner: "{{ pulse_user }}", group: "{{ pulse_group }}", mode: "0755" }
    - { path: "{{ pulse_api_dir }}",     owner: "{{ pulse_user }}", group: "{{ pulse_group }}", mode: "0755" }
    - { path: "{{ pulse_uploads_dir }}", owner: "{{ pulse_user }}", group: "{{ pulse_group }}", mode: "0750" }
    - { path: "{{ pulse_env_dir }}",     owner: "{{ pulse_user }}", group: "{{ pulse_group }}", mode: "0750" }
    - { path: "{{ pulse_log_dir }}",     owner: "{{ pulse_user }}", group: "{{ pulse_group }}", mode: "0755" }
    - { path: "{{ pulse_backup_dir }}",  owner: "{{ pulse_user }}", group: "{{ pulse_group }}", mode: "0750" }
    - { path: "{{ pulse_web_root }}",    owner: "www-data",         group: "www-data",          mode: "0755" }
